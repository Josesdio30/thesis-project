# PR gate — docs/qa/test-strategy.md §9, Sprint 1 item C-1.
# Runs without any secrets, database, or AI provider: every test mocks its
# dependencies, and jest.setup.ts fails any unmocked network call.
name: CI

on:
  # main is the default branch of this repository; staging is kept for the thesis deployment flow.
  pull_request:
    branches: [main, staging]
  push:
    branches: [main, staging]
  schedule:
    - cron: '0 23 * * 0' # Monday 06:00 WIB
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      # postinstall runs `prisma generate`, which needs no database.
      - run: npm ci

      # next-env.d.ts is git-ignored; Next generates it on dev/build.
      - name: Create next-env.d.ts
        run: |
          printf '/// <reference types="next" />\n/// <reference types="next/image-types/global" />\n' > next-env.d.ts

      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:setup

      # Enforces the per-path 100% coverageThreshold entries in jest.config.js.
      - name: Test with coverage gate
        run: npx jest --coverage --ci

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: coverage
          path: coverage/
          retention-days: 14

  # Production build with no database and no real secrets: proves the app compiles and that no page
  # needs a live connection at build time (verified locally 2026-10-17, docs/qa/ci-readiness.md).
  build:
    name: Production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXTAUTH_SECRET: ci-build-only-not-a-secret
      NEXT_TELEMETRY_DISABLED: '1'
      # lib/database.ts refuses to load without explicit DB configuration, and `next build` imports
      # /api/db/test while collecting page data. This URL is never connected to (port 1); verified
      # locally on 2026-10-17: build exits 1 without it and 0 with it.
      DATABASE_URL: postgresql://build:build@127.0.0.1:1/build_placeholder
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build

  # Browser + API journeys against a throwaway Postgres service. tests/e2e/support/env.ts pins every DB
  # variable to 127.0.0.1/lms_e2e_test and refuses anything else, so .env files and repository secrets are
  # never read. The credentials below exist only inside this job's container.
  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: checks
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: e2e-ci-only
          POSTGRES_DB: lms_e2e_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      E2E_DB_USER: postgres
      E2E_DB_PASSWORD: e2e-ci-only
      NEXT_TELEMETRY_DISABLED: '1'
      # playwright.config.ts builds the app inside this job with the test-database environment
      # (`next build`) and serves it with `next start`; it also retries once and fails on flaky tests.
      E2E_SERVER_MODE: production
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Verify fresh setup and bootstrap guards
        env:
          DATABASE_URL: postgresql://postgres:e2e-ci-only@127.0.0.1:5432/lms_setup_test
          LMS_SETUP_TEST_URL: postgresql://postgres:e2e-ci-only@127.0.0.1:5432/lms_setup_test
          LMS_SETUP_AUX_TEST_URL: postgresql://postgres:e2e-ci-only@127.0.0.1:5432/lms_aux_setup_test
        run: |
          node --input-type=module <<'JS'
          import pg from 'pg';
          const adminUrl = new URL(process.env.DATABASE_URL);
          adminUrl.pathname = '/postgres';
          const client = new pg.Client({ connectionString: adminUrl.href });
          await client.connect();
          try {
            await client.query('CREATE DATABASE lms_setup_test');
            await client.query('CREATE DATABASE lms_aux_setup_test');
          } finally { await client.end(); }
          JS
          npm run db:migrate
          npm run test:setup
      - name: Apply LMS schema to the throwaway database
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://postgres:e2e-ci-only@127.0.0.1:5432/lms_e2e_test
      - name: Install the Chromium build pinned by @playwright/test
        run: npx playwright install --with-deps chromium
      # seed.spec.ts is the Playwright agents' empty seed file, not a test.
      - name: Run E2E
        run: npx playwright test --grep-invert "Test group"
      # Uploaded on success and failure: HTML report, JSON results, the app server log
      # (test-reports/e2e-webserver.log) and the traces/screenshots of failed or retried attempts.
      - name: Upload Playwright report, JSON results, server log and traces
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: playwright
          path: |
            playwright-report/
            test-reports/
            test-results/
          if-no-files-found: warn
          retention-days: 14

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name != 'schedule'
    # Read-only: the action lists the PR's commits; PR comments are disabled, so no write scope.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      # Scans only the commits in the PR/push, so the pre-existing leak in
      # history (DC-14/DC-21) does not block every run; it needs an owner decision instead.
      # v3 runs on Node 24 (v2 declared Node 20, which GitHub-hosted runners removed on 2026-09-23).
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Required only for organization-owned repositories; empty for personal accounts.
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
          GITLEAKS_ENABLE_COMMENTS: 'false'

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm audit --audit-level=high --omit=dev
